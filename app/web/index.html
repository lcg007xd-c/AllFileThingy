<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AllFileThingy</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar"><strong>AllFileThingy</strong><button id="logout" class="quiet">Log out</button></header>
  <main class="card workspace">
    <h1>Stitch your videos</h1>
    <p class="muted">Choose clips, put them in order, and get one compatible MP4.</p>
    <section id="picker-view">
      <label class="picker" for="files">
        <span class="picker-icon">＋</span>
        <strong>Choose videos</strong>
        <span class="muted">MP4, MOV, M4V and other videos</span>
      </label>
      <input id="files" class="visually-hidden" type="file" accept="video/*,.mov,.m4v" multiple>
      <ol id="clip-list" class="clip-list" aria-label="Selected clip order"></ol>
      <div id="totals" class="totals muted"></div>
      <p id="error" class="error" role="alert"></p>
      <button id="upload" class="primary" disabled>Upload clips</button>
    </section>
    <section id="status-view" hidden>
      <div class="status-head"><strong id="phase">Uploading</strong><span id="percent">0%</span></div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="progress-bar"></span></div>
      <ol id="upload-list" class="upload-list"></ol>
      <p id="status-message" class="muted" aria-live="polite"></p>
      <a id="download" class="button-link" hidden>Download MP4</a>
      <button id="retry" class="primary" hidden>Try processing again</button>
      <button id="start-over" class="secondary">Delete and start over</button>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
